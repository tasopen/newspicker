name: Daily AI Podcast

on:
  schedule:
    # 毎朝 5:17 JST = UTC 20:17 (前日)
    # 毎時 0 分は GitHub のスケジューラが最も混雑するため避ける
    # （実測: 0 19 * * * は 139〜414 分遅延していた）
    - cron: '17 20 * * *'
  workflow_dispatch:  # 手動実行可能（外部 cron からも叩ける）

permissions:
  contents: write  # docs/ への git push するのに必要
  pages: write     # Pages ビルドの明示的な再要求に必要

# 外部 cron と GitHub スケジューラの二重起動を直列化する
concurrency:
  group: daily-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 同日のエピソードが既にある場合は生成しない
      # （外部 cron とスケジューラが両方発火した場合の二重生成を防ぐ）
      - name: Check for existing episode today
        id: guard
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          if grep -q "ニュース ${TODAY}" docs/feed.xml; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "[guard] episode for ${TODAY} already exists - skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[guard] no episode for ${TODAY} - proceeding"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install ffmpeg
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: uv sync --locked

      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -x
          uv run python scripts/run_pipeline.py

      # GitHub Pages の 1 GB 上限を避けるため、音声実体を Releases / archive.org へ退避する
      - name: Archive episode media
        id: archive
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          set -x
          # archive.org が失敗しても GitHub Releases の URL が確定していれば削除・コミットを続行する
          uv run python scripts/archive_episode.py --latest --delete-local --allow-partial

      # 退避に失敗しても生成済みエピソードを失わないよう、パイプライン成功時は必ずコミットする
      - name: Commit and push episode
        if: steps.guard.outputs.skip != 'true' && (success() || steps.archive.outcome == 'failure')
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: add episode $(date -u +%Y-%m-%d) [skip ci]"
          # Ensure we integrate any remote updates before pushing to avoid rejects
          git fetch origin
          git pull --rebase origin master || true
          git push origin master || true

      # push 後の Pages 自動ビルドが startup_failure で落ちたり stuck した場合に備え、
      # 明示的に再ビルドを要求する（2026-11-12 に発生: 11/12 分が Pages に反映されず
      # Spotify / AntennaPod が 11/11 のまま止まった）
      - name: Ensure Pages build succeeded
        if: steps.guard.outputs.skip != 'true' && (success() || steps.archive.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          SHA=$(git rev-parse HEAD)
          for i in $(seq 1 10); do
            sleep 30
            LATEST=$(gh api "repos/${{ github.repository }}/pages/builds/latest" \
              --jq '.status + " " + .commit' 2>/dev/null || echo "unknown -")
            echo "[pages] attempt $i: $LATEST"
            STATUS=${LATEST%% *}
            COMMIT=${LATEST##* }
            if [ "$STATUS" = "built" ] && [ "$COMMIT" = "$SHA" ]; then
              echo "[pages] build OK for $SHA"
              exit 0
            fi
            if [ "$STATUS" = "errored" ] || [ "$STATUS" = "unknown" ]; then
              echo "[pages] requesting rebuild"
              gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
            fi
          done
          echo "[pages] WARNING: Pages build did not confirm for $SHA"
