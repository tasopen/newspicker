name: Daily AI Podcast

on:
  schedule:
    # 毎朝 4:00 JST = UTC 19:00 (前日)
    - cron: '0 19 * * *'
  workflow_dispatch:  # 手動実行可能

permissions:
  contents: write  # docs/ への git push するのに必要

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pipeline
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -x
          uv run python scripts/run_pipeline.py

      # GitHub Pages の 1 GB 上限を避けるため、音声実体を Releases / archive.org へ退避する
      - name: Archive episode media
        id: archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          set -x
          uv run python scripts/archive_episode.py --latest --delete-local

      # 退避に失敗しても生成済みエピソードを失わないよう、パイプライン成功時は必ずコミットする
      - name: Commit and push episode
        if: success() || steps.archive.outcome == 'failure'
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: add episode $(date -u +%Y-%m-%d) [skip ci]"
          # Ensure we integrate any remote updates before pushing to avoid rejects
          git fetch origin
          git pull --rebase origin master || true
          git push origin master || true
